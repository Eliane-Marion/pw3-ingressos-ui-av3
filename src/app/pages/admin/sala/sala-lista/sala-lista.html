<app-container>
  <div class="page-container">
    <h2>Salas</h2>

    <button routerLink="/salas/novo">
      Nova Sala
    </button>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody>

          <tr *ngFor="let item for sala$ | async; trackBy: trackById">
            
            <td>{{ item.id}}</td>

            <td>{{ item.nome}}</td>

            <td>{{ item.preco}}</td>

            <td>
              <button
                type="button"
                (click)="editar(item.id!)">
              </button>

              <button
                type="button"
                (click)="excluir(item.id!)">
              </button>

            </td>

          </tr>
         
        </tbody>
      </table>
    </div>

</app-container>
