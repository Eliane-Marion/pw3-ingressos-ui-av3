<div class="container">
  <h2>Listagem de Salas</h2>
  <button routerLink="/salas/novo" class="btn btn-primary">Nova Sala</button>

  <table class="table mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      @for (item of (salas$ | async); track item.id) {
        <tr>
          <td>{{ item.id }}</td>
          <td>{{ item.nome }}</td>
          <td>R$ {{ item.preco }}</td>
          <td>
            <button (click)="editar(item.id!)" class="btn btn-warning btn-sm me-2">Editar</button>
            <button (click)="excluir(item.id!)" class="btn btn-danger btn-sm">Excluir</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">Nenhuma sala encontrada.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
